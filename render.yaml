# Render Blueprint: Render reads this file to create the service.
# Secrets are marked sync: false, so Render asks for them in the dashboard; they are never stored here.
services:
  - type: web
    name: citewise
    runtime: docker
    plan: free
    region: singapore   # keep it next to the database (choose the same region in Neon)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ping
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
