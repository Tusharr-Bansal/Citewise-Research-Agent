[project]
name = "citewise"
version = "0.1.0"
description = "Upload a research literature collection and get answers that cite the exact passage"
requires-python = ">=3.11"
dependencies = [
    "fastembed>=0.9,<0.10",
    "numpy",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "google-genai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citewise = ["schema.sql"]
